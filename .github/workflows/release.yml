# Builds and publishes a GitHub Release when `main` is updated, using the
# version from `manifest.json` as the tag (no "v" prefix). Same artifact layout
# as the official sample plugin release process:
# https://github.com/obsidianmd/obsidian-sample-plugin#releasing-new-releases
#
# Bump `version` in `manifest.json` (and add the same key in `versions.json`)
# before merging if you want a new release. If the version tag already exists
# at the current commit, the job skips. If the tag exists on another commit, the job fails.

name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify versions.json matches manifest
        run: |
          VERSION=$(jq -r .version manifest.json)
          MIN=$(jq -r .minAppVersion manifest.json)
          ENTRY=$(jq -r --arg v "$VERSION" '.[$v] // empty' versions.json)
          if [ -z "$ENTRY" ] || [ "$ENTRY" = "null" ]; then
            echo "::error::Add \"$VERSION\": \"$MIN\" to versions.json"
            exit 1
          fi
          if [ "$ENTRY" != "$MIN" ]; then
            echo "::error::versions.json[\"$VERSION\"] must equal minAppVersion ($MIN), got $ENTRY"
            exit 1
          fi

      - name: Lint and typecheck
        run: |
          pnpm run lint
          pnpm run check

      - name: Build plugin
        run: pnpm run build

      - name: Resolve version and tag state
        id: meta
        run: |
          VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('manifest.json','utf8')).version)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          git fetch --tags --force
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            TAG_COMMIT=$(git rev-parse "$VERSION^{commit}")
            HEAD_COMMIT=$(git rev-parse HEAD)
            if [ "$TAG_COMMIT" = "$HEAD_COMMIT" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Release $VERSION already points at this commit; skipping."
            else
              echo "::error::Git tag \"$VERSION\" exists but targets a different commit. Bump \"version\" in manifest.json and add an entry to versions.json before merging."
              exit 1
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create annotated tag
        if: steps.meta.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.meta.outputs.version }}" -m "Release ${{ steps.meta.outputs.version }}"
          git push origin "${{ steps.meta.outputs.version }}"

      # Zip layout: <plugin-id>/manifest.json|main.js|styles.css — extract into .obsidian/plugins/
      - name: Create plugin install zip
        if: steps.meta.outputs.skip != 'true'
        id: bundle
        run: |
          set -euo pipefail
          PLUGIN_ID=$(jq -r .id manifest.json)
          VERSION=$(jq -r .version manifest.json)
          DISPLAY_NAME=$(jq -r .name manifest.json)
          SLUG=$(printf '%s' "$DISPLAY_NAME" | tr '[:upper:]' '[:lower:]' | tr -s ' ' '-' | tr -cd 'a-z0-9.-')
          if [ -z "$SLUG" ]; then SLUG="$PLUGIN_ID"; fi
          ZIP_NAME="${SLUG}-${VERSION}.zip"
          rm -rf dist
          mkdir -p "dist/${PLUGIN_ID}"
          cp manifest.json main.js styles.css "dist/${PLUGIN_ID}/"
          (cd dist && zip -rq "../${ZIP_NAME}" "${PLUGIN_ID}")
          echo "Install zip: ${ZIP_NAME} (folder inside: ${PLUGIN_ID}/)"
          unzip -l "${ZIP_NAME}"
          echo "zip=${ZIP_NAME}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: steps.meta.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.version }}
          name: ${{ steps.meta.outputs.version }}
          generate_release_notes: true
          files: |
            manifest.json
            main.js
            styles.css
            ${{ steps.bundle.outputs.zip }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
